name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Package the application
        run: ./mvnw -B package -DskipTests
      - name: Build the JVM image
        run: docker build -t flat2java-spring-demo:ci .
      - name: Start the container and check readiness
        run: |
          docker run -d --name demo -p 8080:8080 flat2java-spring-demo:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then
              echo "The application is ready."
              exit 0
            fi
            sleep 1
          done
          docker logs demo
          echo "::error::The application did not become ready in 30 seconds"
          exit 1
