name: Bug report
description: An endpoint returns a wrong result, the application fails to start, or a documented step does not work.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Demo version or commit
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "21"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How the application runs
      options:
        - Dev mode (./mvnw spring-boot:run -Dspring-boot.run.profiles=dev)
        - Packaged JVM (java -jar)
        - Container image (JVM)
        - Native executable
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The HTTP request or command, for example a curl command. Replace any personal data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Response body, status code or log excerpt.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
