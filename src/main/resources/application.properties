# HTTP. Health checks are served at the root, not under /actuator.
server.port=8080
# A record is 315 characters; this leaves room for the JSON form of an object (BodySizeLimitFilter).
demo.max-body-size=65536

# Logging. The request ID comes from RequestIdFilter.
logging.level.root=INFO
logging.level.io.github.allanhladki=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId}] %-5level \\(%logger{20}\\): %msg%n%wEx
spring.application.name=flat2java-spring-demo
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always

# OpenAPI document (JSON at /swagger, YAML at /swagger.yaml) and Swagger UI.
springdoc.api-docs.path=/swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Health checks: /health, /health/live and /health/ready.
management.endpoints.web.base-path=/
management.endpoints.web.discovery.enabled=false
management.endpoints.web.exposure.include=health
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState

# flat2java options (flat2java-spring). Only fail-on-string-truncation differs from the defaults:
# a text longer than its column is an error instead of being cut, so no data is lost silently.
flat2java.allow-null-strings=true
flat2java.fail-on-string-truncation=true
flat2java.decimal.use-separator=false
flat2java.decimal.separator=.
flat2java.decimal.rounding-mode=unnecessary
