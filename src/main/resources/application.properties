# HTTP. Health checks are served at the root, not under /actuator.
server.port=8080
# A record is 315 characters; this leaves room for the JSON form of an object (BodySizeLimitFilter).
demo.max-body-size=65536

# Logging. The request ID comes from RequestIdFilter; the pattern shows its first 8 characters.
# Columns: time, level, request ID, class, message. Colors are used when the terminal supports them.
logging.level.root=INFO
logging.level.io.github.allanhladki=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-8.-8X{requestId:-}){magenta} %clr(%-26.-26logger{0}){cyan} %clr(|){faint} %m%n%wEx
# Framework messages of the startup that say nothing the "Ready" report does not.
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.boot.web.servlet.context.ServletWebServerApplicationContext=WARN
logging.level.org.springframework.boot.actuate.endpoint.web.EndpointLinksResolver=WARN
logging.level.org.springframework.boot.web.embedded.tomcat.TomcatWebServer=WARN
logging.level.org.springdoc.api.AbstractOpenApiResource=WARN
# The warning that Swagger is enabled; enabling it is the point of this demo.
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
spring.application.name=flat2java-spring-demo
# The banner and the "Ready" report replace the "Starting" and "Started" lines.
spring.main.log-startup-info=false
spring.jackson.default-property-inclusion=always

# OpenAPI document (JSON at /swagger, YAML at /swagger.yaml) and Swagger UI.
springdoc.api-docs.path=/swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Health checks: /health, /health/live and /health/ready.
management.endpoints.web.base-path=/
management.endpoints.web.discovery.enabled=false
management.endpoints.web.exposure.include=health
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.live.include=livenessState
management.endpoint.health.group.ready.include=readinessState

# flat2java options (flat2java-spring). Only fail-on-string-truncation differs from the defaults:
# a text longer than its column is an error instead of being cut, so no data is lost silently.
flat2java.allow-null-strings=true
flat2java.fail-on-string-truncation=true
flat2java.decimal.use-separator=false
flat2java.decimal.separator=.
flat2java.decimal.rounding-mode=unnecessary
